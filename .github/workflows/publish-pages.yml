name: Publish GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-pages.yml"
      - ".python-version"
      - "memos/**"
      - "pyproject.toml"
      - "pyprojects/phdcalc/docs/**"
      - "pyprojects/phdcalc/pyproject.toml"
      - "pyprojects/phdcalc/src/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: false

      - name: Install PhDCalc dependencies
        run: uv sync --locked --package phdcalc --group docs

      - name: Build PhDCalc documentation
        run: >-
          uv run --locked --package phdcalc --group docs
          sphinx-build -W -b html pyprojects/phdcalc/docs _site

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            fonts-lmodern

      - name: Generate and stage PDFs
        run: |
          bash memos/make-pdfs.sh

          while IFS= read -r markdown; do
            [[ -z "$markdown" ]] && continue
            pdf="${markdown%.md}.pdf"
            destination="_site/memos/$pdf"
            mkdir -p "$(dirname "$destination")"
            cp "memos/$pdf" "$destination"
          done < <(sed -n '/^pdfs:/,$ { /^[[:space:]]*-[[:space:]]*/ { s///; p; } }' memos/pdfs.yaml)

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
