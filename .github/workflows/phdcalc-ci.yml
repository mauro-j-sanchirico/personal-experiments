name: PhDCalc CI

on:
  push:
    branches:
      - main
    paths:
      - "pyprojects/phdcalc/**"
      - ".github/workflows/phdcalc-ci.yml"
      - ".python-version"
      - "pyproject.toml"
      - "ruff.toml"
      - "uv.lock"
      - "uv.toml"
  pull_request:
    paths:
      - "pyprojects/phdcalc/**"
      - ".github/workflows/phdcalc-ci.yml"
      - ".python-version"
      - "pyproject.toml"
      - "ruff.toml"
      - "uv.lock"
      - "uv.toml"

permissions:
  contents: read

jobs:
  checks:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyprojects/phdcalc

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --package phdcalc --group docs

      - name: Run pytest
        run: uv run --locked --package phdcalc pytest

      - name: Run mypy
        run: uv run --locked --package phdcalc mypy src tests

      - name: Run Ruff
        run: uv run --locked --package phdcalc ruff check src tests docs/conf.py

      - name: Build documentation
        run: >-
          uv run --locked --package phdcalc --group docs
          sphinx-build -W -b html docs docs/_build/html
