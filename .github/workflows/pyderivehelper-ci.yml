name: pyderivehelper CI

on:
  push:
    branches:
      - main
    paths:
      - "pyprojects/pyderivehelper/**"
      - ".github/workflows/pyderivehelper-ci.yml"
      - ".python-version"
      - "pyproject.toml"
      - "ruff.toml"
      - "uv.lock"
      - "uv.toml"
  pull_request:
    paths:
      - "pyprojects/pyderivehelper/**"
      - ".github/workflows/pyderivehelper-ci.yml"
      - ".python-version"
      - "pyproject.toml"
      - "ruff.toml"
      - "uv.lock"
      - "uv.toml"

permissions:
  contents: read

jobs:
  checks:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyprojects/pyderivehelper

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --package pyderivehelper --group docs

      - name: Run pytest
        run: uv run --locked --package pyderivehelper pytest

      - name: Run mypy
        run: uv run --locked --package pyderivehelper mypy src tests

      - name: Run Ruff
        run: uv run --locked --package pyderivehelper ruff check src tests docs/conf.py

      - name: Build documentation
        run: >-
          uv run --locked --package pyderivehelper --group docs
          sphinx-build -W -b html docs docs/_build/html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pyprojects/pyderivehelper/docs/_build/html

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
