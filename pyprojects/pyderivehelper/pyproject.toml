[project]
name = "pyderivehelper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel",
    "ipympl>=0.10.0",
    "ipython>=9.11.0",
    "matplotlib>=3.10.8",
    "openai",
    "pillow",
    "pylatexenc",
    "python-dotenv",
    "pyyaml>=6.0.2",
    "wolframclient>=1.4.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
