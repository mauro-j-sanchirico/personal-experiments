[project]
name = "phdcalc"
version = "0.1.0"
description = "Python tools for performing mathematical derivations and calculations in Jupyter notebooks using Wolfram|Alpha and OpenAI APIs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel",
    "ipympl>=0.10.0",
    "ipython>=9.11.0",
    "matplotlib>=3.10.8",
    "openai",
    "pillow",
    "pylatexenc",
    "python-dotenv",
    "pyyaml>=6.0.2",
    "wolframclient>=1.4.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
    "types-PyYAML",
]
docs = [
    "sphinx",
    "sphinx-autoapi",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
